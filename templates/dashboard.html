{% extends "base.html" %}

{% block content %}

<style>

/* FULL BACKGROUND */
body {
    margin: 0;
    padding: 0;
    background: url('{{ url_for('static', filename='images/clinic_bg.jpg') }}') no-repeat center center fixed;
    background-size: cover;
}

/* DARK OVERLAY FOR TEXT VISIBILITY */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

</style>

<!-- MAIN CONTAINER -->
<div style="
    position: relative;
    height: 100vh;
    width: 100%;
    padding: 60px;
    box-sizing: border-box;
">

    <!-- 🔹 RIGHT SIDE CLOCK -->
    <div style="
        position: absolute;
        top: 140px;
        right: 40px;
        text-align: right;
    ">

        <!-- TIME -->
        <div id="live-clock" style="
            font-size: 55px;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 3px 3px 12px rgba(0,0,0,1);
            white-space: nowrap;
        "></div>

        <!-- DATE (AUTO UPDATE) -->
        <div id="live-date" style="
            color: #e2e8f0;
            margin-top: 8px;
            font-size: 16px;
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
        "></div>

        <!-- BLUE LINE -->
        <div style="
            width: 80px;
            height: 3px;
            background: #38bdf8;
            margin-top: 10px;
            margin-left: auto;
        "></div>

    </div>

    <!-- 🔹 LEFT TEXT -->
    <div style="margin-top: 80px;">
        <h1 style="
            color: white;
            font-size: 28px;
            margin: 0;
            font-weight: 400;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        ">
            Welcome,
        </h1>

        <h1 style="
            color: #38bdf8;
            font-size: 60px;
            margin: 0;
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
        ">
            Dr. Geethika
        </h1>

        <p style="
            color: #e2e8f0;
            margin-top: 10px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.8);
        ">
            PEARL32 DENTAL CARE | CLINICAL COMMAND CENTER
        </p>
    </div>

</div>

<script>
function updateClock() {
    const clock = document.getElementById("live-clock");
    const date = document.getElementById("live-date");

    if (!clock || !date) return;

    const now = new Date();

    // TIME
    const timeOptions = {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    };

    clock.innerText = now.toLocaleTimeString('en-US', timeOptions);

    // DATE
    const dateOptions = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    };

    date.innerText = now.toLocaleDateString('en-US', dateOptions);
}

setInterval(updateClock, 1000);
updateClock();
</script>

{% endblock %}
